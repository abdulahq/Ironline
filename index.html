<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironline</title>
<meta name="theme-color" content="#0a0c0e">
<meta name="description" content="A personal strength-training plan and workout tracker.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironline">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a left rail on desktop, a bottom tab bar on phones. One column of cards per view.
   Hairline figures sit on surface cards and carry each view's identity; everything else is quiet. */
:root {
  --bg: #eceff1;
  --surface: #ffffff;
  --surface2: #f4f6f7;
  --ink: #14181b;
  --muted: #5a626a;
  --line: #d9dee2;
  --edge: #6d747c;
  --mid: #b4bac1;
  --lo: #d5d9de;
  --accent: #0b7a75;
  --accent-ink: #ffffff;
  --accent-soft: #d9f0ee;
  --warn: #a4510b;
  --danger: #b3261e;
  --scrim: rgba(12, 16, 20, .46);
  --shadow: 0 14px 36px rgba(12, 18, 24, .18), 0 1px 3px rgba(12, 18, 24, .12);
  --disp: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --sans: "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --hairline-plate: var(--surface);
  --hairline-hi: var(--ink);
  --hairline-edge: var(--edge);
  --hairline-mid: var(--mid);
  --hairline-lo: var(--lo);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c0e;
    --surface: #131619;
    --surface2: #1a1d21;
    --ink: #eceff1;
    --muted: #98a0a8;
    --line: #262a30;
    --edge: #98a0a9;
    --mid: #4b515a;
    --lo: #2b3036;
    --accent: #4fd1c5;
    --accent-ink: #06201e;
    --accent-soft: #123430;
    --warn: #f0a35e;
    --danger: #ff8a80;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 14px 36px rgba(0, 0, 0, .6), 0 1px 3px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c0e;
  --surface: #131619;
  --surface2: #1a1d21;
  --ink: #eceff1;
  --muted: #98a0a8;
  --line: #262a30;
  --edge: #98a0a9;
  --mid: #4b515a;
  --lo: #2b3036;
  --accent: #4fd1c5;
  --accent-ink: #06201e;
  --accent-soft: #123430;
  --warn: #f0a35e;
  --danger: #ff8a80;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 14px 36px rgba(0, 0, 0, .6), 0 1px 3px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--sans);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, p, ol, ul, dl, dd, figure { margin: 0; }
h1, h2, h3 { font-family: var(--disp); font-weight: 700; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: clamp(36px, 6.4vw, 56px); line-height: .96; text-transform: uppercase; }
h2 { font-size: 26px; line-height: 1.05; text-transform: uppercase; }
h3 { font-size: 21px; line-height: 1.12; }
.eyebrow { font: 600 12px/1.2 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.shell { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 28px; align-items: start; padding-block: 20px; }
.rail { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 28px/1 var(--disp); letter-spacing: .06em; text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.rail-foot { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
main { min-width: 0; display: flex; flex-direction: column; gap: 18px; padding-bottom: 48px; }
.tabbar { display: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.pad { padding: 16px 18px; }
.art { background: var(--surface); border-radius: 10px; min-width: 0; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.icon { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.icon:hover { background: var(--surface2); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); font-size: 13px; }
.chip b { font: 500 13px var(--mono); }
.badge { font: 500 10.5px/1 var(--mono); letter-spacing: .04em; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.badge.pr { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) clamp(150px, 30vw, 270px); gap: 14px; align-items: center; padding: 18px 20px; }
.hero-t { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sub { color: var(--muted); }
.ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, input[type="text"], input[type="search"], input[type="number"], textarea {
  background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; max-width: 100%;
}
textarea { width: 100%; resize: vertical; min-height: 64px; }
.save-state { font-size: 12px; color: var(--muted); }
.save-state.bad { color: var(--warn); font-weight: 600; }

.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 10px; }
.strip a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 10px; text-decoration: none; color: var(--ink); border: 1px solid transparent; }
.strip a.today { border-color: var(--ink); }
.strip .dow { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.strip .dn { font: 500 15px var(--mono); }
.strip .dt { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--edge); }
.strip .dt.done { background: var(--accent); border-color: var(--accent); }
.strip .dt.rest { border-style: dotted; border-color: var(--mid); }
.strip .ty { font-size: 11px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.prog { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 6; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.prog-t { display: flex; align-items: baseline; gap: 8px; }
.prog-t .num { font-size: 22px; font-weight: 500; }
.bar { height: 6px; border-radius: 6px; background: var(--surface2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

.block { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; }
.block .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.chk { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1.5px solid var(--edge); background: var(--surface); color: transparent; display: grid; place-items: center; cursor: pointer; }
.chk .ic { width: 22px; height: 22px; stroke-width: 2.4; }
.chk[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.ex { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.ex-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ex-h > div:first-child { min-width: 0; }
.ex-var, .ex-meta { font-size: 13px; color: var(--muted); }
.ex-tools { display: flex; gap: 2px; flex: none; }
.rx { font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.hint { font-size: 13px; color: var(--muted); }
.hint b { color: var(--accent); font-weight: 600; }
.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.set.timed { grid-template-columns: 28px minmax(0, 1fr) 44px; }
.set.head { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.set.head span:nth-child(n+2) { text-align: center; }
.sn { font: 500 14px var(--mono); color: var(--muted); text-align: center; }
.set input { width: 100%; text-align: center; font: 500 16px var(--mono); min-height: 44px; padding: 6px; }
.set.done input { background: var(--accent-soft); border-color: transparent; }
.set.done .sn { color: var(--accent); }
.ex-foot { display: flex; gap: 8px; flex-wrap: wrap; }

.fin { display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.kv > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kv dt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv dd { font: 500 20px var(--mono); }
.kv small { font: 400 12px var(--sans); color: var(--muted); }

.rest-card { display: grid; grid-template-columns: minmax(0, 1fr) clamp(130px, 26vw, 220px); gap: 14px; align-items: center; padding: 18px 20px; }
.moves { display: flex; flex-wrap: wrap; gap: 6px; }
.moves span { font-size: 13px; padding: 3px 9px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); }

.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: inline-flex; align-items: center; min-height: 42px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 500; }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.setup { display: flex; flex-direction: column; gap: 20px; padding: 18px 20px; }
.setup fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.setup legend { padding: 0; margin-bottom: 8px; font: 700 18px var(--disp); letter-spacing: .04em; text-transform: uppercase; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }

.day { padding: 0; }
.day > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 14px 16px; }
.day > summary::-webkit-details-marker { display: none; }
.day.today { border-color: var(--ink); }
.d-date { display: flex; flex-direction: column; }
.d-date b { font: 700 22px/1 var(--disp); text-transform: uppercase; }
.d-date span { font-size: 12px; color: var(--muted); }
.d-title { font-weight: 600; }
.d-sub { font-size: 13px; color: var(--muted); }
.d-state { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.d-state.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.plist { margin: 0; padding: 4px 16px 16px 106px; display: grid; gap: 4px; font-size: 14px; list-style: decimal; }
.plist li span { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
.day .btn { margin: 0 16px 16px 106px; }
.wk { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.lib-top { display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lib-g { display: flex; flex-direction: column; gap: 8px; }
.lib-g h2 small { font: 500 13px var(--sans); text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: 8px; }
.lib-s { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.rows { display: flex; flex-direction: column; }
.rowx { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
.rowx:first-child { border-top: 0; }
.rowx > div:first-child { min-width: 0; }
.rowx .nm { font-weight: 500; }
.rowx .sb { font-size: 12.5px; color: var(--muted); }
.rowx .bd { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 500 26px/1.1 var(--mono); }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.chart-w { overflow-x: auto; }
.chart { width: 100%; min-width: 440px; height: auto; display: block; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .cb { fill: var(--mid); }
.chart .cb.now { fill: var(--accent); }
.body-col { display: flex; flex-direction: column; gap: 14px; }
.chart text { fill: var(--muted); font: 500 11px var(--mono); }
.chart text.v { fill: var(--ink); }
.hb { display: grid; grid-template-columns: 110px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 14px; }
.hb i { display: block; height: 10px; border-radius: 5px; background: var(--accent); min-width: 3px; }
.hb .mono { text-align: right; }
.hl { padding: 0; }
.hl > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.hl > summary::-webkit-details-marker { display: none; }
.hl-b { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.hl-b ul { padding: 0; list-style: none; display: grid; gap: 8px; }
.hl-b li b { font-weight: 600; }
.hl-b li span { display: block; font: 400 12.5px var(--mono); color: var(--muted); }
.empty { display: grid; grid-template-columns: minmax(0, 1fr) clamp(130px, 26vw, 220px); gap: 14px; align-items: center; padding: 18px 20px; }

.sheet-wrap { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet { width: min(580px, 100%); max-height: 88dvh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pk-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; max-height: 44dvh; overflow: auto; }
.pk-list button { all: unset; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.pk-list button:first-child { border-top: 0; }
.pk-list button:hover, .pk-list button:focus-visible { background: var(--surface2); }
.pk-list button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pk-list .nm { font-weight: 500; }
.pk-list .sb { font-size: 12.5px; color: var(--muted); }
.pk-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pk-row label.ck { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }

.timer { position: fixed; z-index: 55; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.timer .eyebrow { color: inherit; opacity: .7; }
.t-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.t-time { font: 500 34px/1 var(--mono); }
.t-label { font-size: 14px; }
.timer .bar { background: rgba(127,127,127,.3); border: 0; }
.timer .bar i { background: var(--bg); }
.timer.go .bar i { background: var(--accent); }
.t-btns { display: flex; gap: 8px; }
.timer .btn { background: transparent; color: inherit; border-color: rgba(127,127,127,.55); }
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.data-t { display: grid; grid-template-columns: minmax(0, 1fr) clamp(120px, 24vw, 200px); gap: 14px; align-items: center; }
.data-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.rules { display: grid; gap: 8px; padding-left: 18px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); padding-block: 12px 100px; gap: 0; }
  .rail { display: none; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 50; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; border-radius: 8px; }
  .tabbar a[aria-current="page"] { color: var(--accent); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .plist, .day .btn { padding-left: 16px; margin-left: 16px; }
  .plist { margin-left: 0; }
  .day > summary { grid-template-columns: 64px minmax(0, 1fr); }
  .day > summary .d-state { grid-column: 2; justify-self: start; }
}
@media (min-width: 861px) {
  .sheet-wrap { align-items: center; }
  .sheet { border-radius: 18px; }
  .timer { left: auto; width: 340px; bottom: max(20px, env(safe-area-inset-bottom, 0px)); right: max(20px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 520px) {
  .hero, .rest-card, .empty, .data-t { grid-template-columns: minmax(0, 1fr); }

  const t = $("#tTime"), b = $("#tBar"); if (!t || !b) return;
  t.textContent = Math.floor(left / 60) + ":" + pad(left % 60);
  b.style.width = clamp(100 * (1 - ms / (timer.total * 1000)), 0, 100) + "%";
  if (left <= 0 && !timer.done) { timer.done = true; $("#timer").classList.add("go"); $("#tLabel").textContent = "Go. Next set."; beep(); setTimeout(() => { if (timer && timer.done) stopTimer(); }, 2600); }
}

}

function niceTop(max) { const st = [4, 8, 12, 16, 20, 24, 30, 40, 50, 60, 80, 100, 120, 160, 200, 300, 400, 600, 800, 1000]; return st.find((s) => s >= max) || Math.ceil(max / 500) * 500; }
function weeklyChart() {
  const mon = monday(today()), W = 8, weeks = [];
  for (let k = W - 1; k >= 0; k--) weeks.push({ ws: addDays(mon, -7 * k), sets: 0 });
  Object.values(state.sessions).forEach((s) => { const w = weeks.find((x) => x.ws === monday(s.date)); if (w) w.sets += doneSets(s); });
  const top = niceTop(Math.max(4, ...weeks.map((w) => w.sets)));
  const X0 = 36, X1 = 632, Y0 = 18, Y1 = 188, bw = (X1 - X0) / W;
  let g = "";
  [0, top / 2, top].forEach((v) => { const y = Y1 - (v / top) * (Y1 - Y0); g += '<line class="gl" x1="' + X0 + '" x2="' + X1 + '" y1="' + y + '" y2="' + y + '"/><text x="' + (X0 - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + v + "</text>"; });
  weeks.forEach((w, i) => {
    const h = (w.sets / top) * (Y1 - Y0), x = X0 + i * bw + bw * 0.2, cur = i === W - 1;
    g += '<rect class="cb' + (cur ? " now" : "") + '" x="' + x.toFixed(1) + '" y="' + (Y1 - h).toFixed(1) + '" width="' + (bw * 0.6).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3"/>';

}

  h += '<div class="row2"><fieldset><legend>Level</legend>' + radios("level", [["beginner", "Beginner"], ["intermediate", "Intermediate"], ["advanced", "Advanced"]], p.level) + "</fieldset>";
  h += '<fieldset><legend>Session length</legend>' + radios("minutes", [[30, "30 min"], [45, "45 min"], [60, "60 min"], [75, "75 min"]], p.minutes) + "</fieldset></div>";
  h += '<fieldset><legend>Days per week</legend>' + radios("days", [[3, "3"], [4, "4"], [5, "5"], [6, "6"]], p.days) + '<p class="hint" id="dayHint"></p></fieldset>';
  h += '<fieldset><legend>Equipment</legend><div class="ctl-row"><button type="button" class="btn small" data-act="gear-preset" data-p="full">Full gym</button><button type="button" class="btn small" data-act="gear-preset" data-p="home">Home dumbbells</button><button type="button" class="btn small" data-act="gear-preset" data-p="body">Bodyweight only</button></div><div class="seg" id="gearSeg">' +
    EQUIP.map(([id, n]) => '<label><input type="checkbox" name="gear" value="' + id + '"' + (p.gear[id] || id === "BW" ? " checked" : "") + (id === "BW" ? " disabled" : "") + "><span>" + esc(n) + "</span></label>").join("") + "</div></fieldset>";
  if (!first) {
    h += '<div class="row2"><fieldset><legend>Weight unit</legend>' + radios("unit", [["kg", "kg"], ["lb", "lb"]], p.unit) + "</fieldset>";
    h += '<fieldset><legend>Keep records for</legend>' + radios("keep", [[30, "30 days"], [90, "90 days"], [365, "1 year"], [0, "Forever"]], p.keep) + "</fieldset></div>";
    h += '<div class="row2"><fieldset><legend>Your name</legend><input type="text" name="name" maxlength="40" autocomplete="off" value="' + esc(p.name) + '" aria-label="Your name"></fieldset><fieldset><legend>Rest timer sound</legend><div class="seg"><label><input type="checkbox" name="sound"' + (p.sound ? " checked" : "") + "><span>Beep when rest ends</span></label></div></fieldset></div>";
  }
  h += '<div class="ctl-row"><button class="btn primary" type="submit">' + (first ? "Build my plan" : "Save and rebuild plan") + "</button></div></form>";
  return h;
}
function viewWelcome() {
  return '<header class="card hero"><div class="hero-t"><p class="eyebrow">Ironline</p><h1>A plan that fits your week</h1><p class="sub">Answer five questions. Ironline builds each day\'s workout from 220 exercises, tracks every set, and keeps the record on this device.</p></div>' + art("vault", "A vault door with a dial") + "</header>" + setupForm(true);
}
function viewYou() {
  const p = state.profile;
  return '<header class="card hero"><div class="hero-t"><p class="eyebrow">' + esc(p.name ? p.name : "Settings") + '</p><h1>You</h1><p class="sub">Your plan and your data. Change anything and the plan rebuilds.</p></div>' + art("padlock", "A padlock whose shackle lifts as the pointer comes near") + "</header>" + setupForm(false) +
    '<section class="card pad" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;flex-direction:column;gap:8px"><h2>Your data</h2><p class="muted">Everything is stored in this browser on this device. Nothing is sent anywhere. Clearing site data erases it, so copy a backup now and then.</p><p class="save-state"></p></div>' +
    '<div class="data-actions"><button class="btn" data-act="install-app" id="installAppSettings" hidden>Install app</button><button class="btn" data-act="backup-show">Show backup</button><button class="btn" data-act="backup-copy">Copy backup</button><button class="btn" data-act="restore-open">Restore from backup</button><button class="btn danger" data-act="erase">Erase all data</button></div><textarea id="bk" rows="4" class="mono" style="display:none" readonly aria-label="Backup text"></textarea></section>';
}
function updateHints() {
  const f = $("#setupForm"); if (!f) return;
  const fd = new FormData(f), g = GOALS[fd.get("goal")] || GOALS.muscle, sp = SPLITS[fd.get("days")] || SPLITS[4];
  const a = $("#goalHint"), b = $("#dayHint");
  if (a) a.textContent = g.hint;
  if (b) b.textContent = sp.name + ": " + sp.when + (sp.days.length === 6 ? ", Sunday rest." : ". Other days rest or light cardio.");
}
function saveProfile() {
  const f = $("#setupForm"), fd = new FormData(f), p = state.profile, first = !p.done;
  p.goal = fd.get("goal") || p.goal; p.level = fd.get("level") || p.level;
  p.minutes = +fd.get("minutes") || p.minutes; p.days = +fd.get("days") || p.days;
  const gs = fd.getAll("gear"); p.gear = { BW: 1 }; EQUIP.forEach(([id]) => { if (id !== "BW") p.gear[id] = gs.includes(id) ? 1 : 0; });
  if (!first) {
    p.unit = fd.get("unit") || p.unit; p.keep = +fd.get("keep"); if (isNaN(p.keep)) p.keep = 90;
    p.name = String(fd.get("name") || "").slice(0, 40); p.sound = fd.get("sound") === "on";
  }
  p.done = true;
  const d = today(), s = state.sessions[d];
  if (s && !isLogged(s) && !s.startedAt) delete state.sessions[d];
  prune(); save(); flush();
  toast(first ? "Plan ready" : "Plan updated");
  if (location.hash !== "#today") location.hash = "#today"; else route(true);
}

/* ---------- PWA install ---------- */
let installPrompt = null;
const installButtons = () => [$("#installAppDesktop"), $("#installAppSettings")].filter(Boolean);
function showInstallButtons(show) { installButtons().forEach((b) => { b.hidden = !show; }); }
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault(); installPrompt = e; showInstallButtons(true);
});
window.addEventListener("appinstalled", () => {
  installPrompt = null; showInstallButtons(false); toast("Ironline installed");
});
function promptInstall() {
  if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) {
    toast("Ironline is already installed"); return;
  }
  if (installPrompt) {
    installPrompt.prompt();
    installPrompt.userChoice.then((choice) => {
      if (choice.outcome === "accepted") showInstallButtons(false);
      installPrompt = null;
    });
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  toast(ios ? "Tap Share, then Add to Home Screen" : "Use your browser menu and choose Install app or Add to Home Screen");
}
if (!(window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true)) showInstallButtons(true);
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

/* ---------- actions ---------- */
const ACT = {
  "install-app"() { promptInstall(); },
  "set-done"(el) {
    const s = ensureToday(), it = s.items[+el.dataset.i], j = +el.dataset.j, x = it && it.sets[j]; if (!x) return;
    const row = el.closest(".set"), sug = suggestion(it, s.date);
    x.done = !x.done;
    if (x.done) {
      touch(s);
      const ph = placeholders(it, j, sug);
      if (x.reps == null) x.reps = parseInt(ph.reps, 10) || it.target.lo;
      if (!it.timed && x.kg == null && ph.kgv) x.kg = ph.kgv;
      const last = s.items.every((a) => a.sets.every((b) => b.done));
      if (!last) startTimer(it.target.rest, it.name + " · set " + (j + 1) + " of " + it.sets.length);
    } else if (timer) stopTimer();
    row.classList.toggle("done", x.done); el.setAttribute("aria-pressed", x.done);
    const kg = $(".kg", row), rp = $(".reps", row);
    if (kg) kg.value = x.kg == null ? "" : fmtW(x.kg);
    if (rp) rp.value = x.reps == null ? "" : x.reps;
    const nx = row.nextElementSibling; if (nx && nx.classList.contains("set")) { const ph = placeholders(it, j + 1, sug), nk = $(".kg", nx), nr = $(".reps", nx); if (nk) nk.placeholder = ph.kg; if (nr) nr.placeholder = ph.reps; }
    updateProgress(); save();
  },
  "set-add"(el) { const it = ensureToday().items[+el.dataset.i]; it.sets.push({ kg: null, reps: null, done: false }); save(); renderBody(); },
  "set-del"(el) { const it = ensureToday().items[+el.dataset.i]; if (it.sets.length > 1) it.sets.pop(); save(); renderBody(); },
  "ex-remove"(el) { const s = ensureToday(); s.items.splice(+el.dataset.i, 1); s.cool.moves = coolFor(s.items); save(); renderBody(); },
  "ex-swap"(el) {
    const i = +el.dataset.i, it = ensureToday().items[i];
    openPicker({ title: "Swap " + it.name, group: it.group, onPick(ex) { const s = ensureToday(); s.items[i] = makeItem(ex, i); s.cool.moves = coolFor(s.items); save(); renderBody(); } });
  },
  "ex-add"() {
    openPicker({ title: "Add exercise", group: "all", onPick(ex) { const s = ensureWorkout(ensureToday()); addExercise(s, ex); save(); route(true); } });
  },
  "warm-toggle"() { const s = ensureToday(); s.warm.done = !s.warm.done; if (s.warm.done) touch(s); save(); renderBody(); },
  "cool-toggle"() { const s = ensureToday(); s.cool.done = !s.cool.done; save(); renderBody(); },
  "cardio-toggle"() { const s = ensureToday(); s.cardio.done = !s.cardio.done; if (s.cardio.done) touch(s); save(); renderBody(); },
  "cardio-add"() { const s = ensureToday(); s.cardio = pickCardio(rng(hash(s.date + "cardio")), 10); save(); renderBody(); },
  "cardio-remove"() { ensureToday().cardio = null; save(); renderBody(); },
  "finish"() {
    const s = ensureToday(); s.finishedAt = Date.now(); if (!s.startedAt) s.startedAt = s.finishedAt;
    s.items.forEach((it) => {
      it.pr = false;
      const cur = Math.max(0, ...it.sets.filter((x) => x.done && x.kg > 0 && x.reps).map((x) => e1rm(x.kg, x.reps)));
      let prev = 0;
      Object.values(state.sessions).forEach((o) => { if (o.date !== s.date) o.items.forEach((a) => { if (a.key === it.key) a.sets.forEach((x) => { if (x.done && x.kg > 0 && x.reps) prev = Math.max(prev, e1rm(x.kg, x.reps)); }); }); });
      if (prev > 0 && cur > prev) it.pr = true;
    });
    stopTimer(); prune(); save(); flush(); renderBody(); toast("Workout saved on this device");
  },
  "reopen"() { const s = ensureToday(); s.finishedAt = null; save(); renderBody(); },
  "shuffle"() {
    const s = ensureToday();
    const go = () => { const n = buildSession(s.date, s.type, (s.shuffle || 0) + 1); n.note = s.note; state.sessions[s.date] = n; save(); route(true); };
    if (isLogged(s)) confirmSheet("Shuffle exercises?", "This replaces today's exercises and clears the sets you logged.", "Shuffle", true).then((y) => y && go()); else go();
  },
  "train-anyway"() { const s = ensureToday(); const n = buildSession(s.date, "full", 0); state.sessions[s.date] = n; save(); route(true); },
  "timer-add"() { if (timer) { timer.end += 15000; timer.total += 15; timer.done = false; $("#timer").classList.remove("go"); drawTimer(); } },
  "timer-skip"() { stopTimer(); },
  "week-prev"() { weekOff = Math.max(-4, weekOff - 1); route(true); },
  "week-next"() { weekOff = Math.min(2, weekOff + 1); route(true); },
  "lib-g"(el) { lib.g = el.dataset.g; $$("#libG .fchip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.g === lib.g)); $("#libList").innerHTML = libList(); },
  "lib-e"(el) { const e = el.dataset.e; lib.eq.has(e) ? lib.eq.delete(e) : lib.eq.add(e); el.setAttribute("aria-pressed", lib.eq.has(e)); $("#libList").innerHTML = libList(); },
  "lib-mine"(el) { lib.mine = !lib.mine; el.setAttribute("aria-pressed", lib.mine); $("#libList").innerHTML = libList(); },
  "lib-add"(el) {
    const ex = EX[+el.dataset.id]; let s = ensureToday();
    s = ensureWorkout(s); addExercise(s, ex); save(); $("#libList").innerHTML = libList(); toast("Added to today");
  },
  "hist-del"(el) {
    const d = el.dataset.d;
    confirmSheet("Delete this record?", fmtLong(d) + " will be removed from this device.", "Delete", true).then((y) => { if (y) { delete state.sessions[d]; save(); route(true); toast("Record deleted"); } });
  },
  "gear-preset"(el) {
    const set = { full: ["DB", "BB", "CB", "MC", "KB", "BD", "OTH"], home: ["DB"], body: [] }[el.dataset.p] || [];
    $$("#gearSeg input").forEach((i) => { if (i.value !== "BW") i.checked = set.includes(i.value); });
  },
  "backup-show"() { const t = $("#bk"); t.style.display = "block"; t.value = JSON.stringify(state); t.focus(); t.select(); },
  "backup-copy"() {
    const t = $("#bk"); t.style.display = "block"; t.value = JSON.stringify(state);
    const ok = () => toast("Backup copied");
    try { navigator.clipboard.writeText(t.value).then(ok, () => { t.focus(); t.select(); toast("Select and copy the text"); }); } catch (e) { t.focus(); t.select(); toast("Select and copy the text"); }
  },
  "restore-open"() {
    const sh = openSheet('<div class="sheet-h"><h2>Restore backup</h2><button class="icon" data-sheet="no" aria-label="Close">' + ICON.x + '</button></div><p class="muted">Paste a backup you copied earlier. It replaces the data on this device.</p><textarea id="rsTxt" rows="6" class="mono" aria-label="Backup text"></textarea><p class="hint" id="rsErr" style="color:var(--danger)"></p><div class="pk-row"><button class="btn primary" data-sheet="go">Restore</button><button class="btn" data-sheet="no">Cancel</button></div>', "Restore backup");
    sh.addEventListener("click", (e) => {
      const b = e.target.closest("[data-sheet]"); if (!b) return;
      if (b.dataset.sheet !== "go") return;
      try { const o = JSON.parse($("#rsTxt").value); if (!o || o.v !== 1 || !o.profile || typeof o.sessions !== "object") throw new Error("shape"); state = normalize(o); state.profile.done = true; flush(); closeSheet(); route(true); toast("Backup restored"); } catch (err) { $("#rsErr").textContent = "That is not an Ironline backup."; }
    });
  },
  "erase"() {
    confirmSheet("Erase everything?", "Your plan, settings and every workout record on this device will be deleted. This cannot be undone.", "Erase all data", true).then((y) => {
      if (!y) return;
      state = { v: 1, profile: DEFAULT_PROFILE(), sessions: {} };
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      savedAt = 0; location.hash = "#today"; route(true); toast("All data erased");
    });
  },
};
function addExercise(s, ex) {
  if (ex.g === "cardio") { s.cardio = { name: ex.n, minutes: 10, done: false }; return; }
  if (ex.g === "mobility") { const box = ex.s === "Dynamic warm-up" ? s.warm : s.cool; if (box && !box.moves.includes(ex.n)) box.moves.push(ex.n); return; }
  if (s.items.some((i) => i.key === ex.key)) return;
  s.items.push(makeItem(ex, s.items.length));
  s.cool.moves = coolFor(s.items);
}
function changeType(type) {
  const s = ensureToday();
  if (type === s.type) return;
  const go = () => { const n = buildSession(s.date, type, 0); n.note = s.note; state.sessions[s.date] = n; save(); route(true); };
  if (isLogged(s)) confirmSheet("Change today's workout?", "This replaces today's exercises and clears the sets you logged.", "Change", true).then((y) => { if (y) go(); else route(true); }); else go();
}

document.addEventListener("click", (e) => {
  const pickBtn = e.target.closest("[data-pick]");
  if (pickBtn && pk) { const ex = EX[+pickBtn.dataset.pick], fn = pk.o.onPick; closeSheet(); pk = null; fn(ex); return; }
  const sh = e.target.closest("[data-sheet]");
  if (sh && sheetEl && !sheetEl._cancel && sh.dataset.sheet === "no") { closeSheet(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.matches && t.matches(".kg, .reps")) {
    const s = ensureToday(), it = s.items[+t.dataset.i], x = it && it.sets[+t.dataset.j]; if (!x) return;
    const v = num(t.value);
    if (t.classList.contains("kg")) x.kg = v == null ? null : Math.round(fromDisp(v) * 100) / 100; else x.reps = v == null ? null : Math.round(v);
    if (v != null) touch(s);
    save(); if (x.done) updateProgress();
  } else if (t.id === "note") { ensureToday().note = t.value; save(); }
  else if (t.id === "cMin") { const s = ensureToday(); if (s.cardio) { s.cardio.minutes = clamp(Math.round(+t.value) || 1, 1, 120); save(); } }
  else if (t.id === "libQ") { lib.q = t.value; $("#libList").innerHTML = libList(); }
  else if (t.id === "pkQ" && pk) { pk.q = t.value; drawPicker(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "todayType") changeType(t.value);
  else if (t.id === "pkG" && pk) { pk.g = t.value; drawPicker(); }
  else if (t.id === "pkM" && pk) { pk.mine = t.checked; drawPicker(); }
  else if (t.closest && t.closest("#setupForm")) updateHints();
});
document.addEventListener("submit", (e) => { if (e.target.id === "setupForm") { e.preventDefault(); saveProfile(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetEl) { const c = sheetEl._cancel; closeSheet(); if (c) c(); } });
window.addEventListener("hashchange", () => route());
document.addEventListener("visibilitychange", () => {
  if (document.hidden) flush();
  else if (today() !== lastDate) { lastDate = today(); route(true); }
});
window.addEventListener("pagehide", flush);
window.addEventListener("focus", () => { if (today() !== lastDate) { lastDate = today(); route(true); } });

/* ---------- boot ---------- */
load();
initShell();
route(true);
})();
</script>

</body>
</html>
